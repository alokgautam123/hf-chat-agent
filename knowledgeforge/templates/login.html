<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Log in · KnowledgeForge</title>
        <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    </head>
    <body>
        <main class="auth-shell">
            <section class="document-panel auth-panel" aria-labelledby="login-heading">
                <p class="eyebrow">Welcome back</p>
                <h1 id="login-heading">Log in</h1>
                <p class="intro">Continue to your KnowledgeForge workspace.</p>

                {% if error %}
                    <p class="message message-error" role="alert">{{ error }}</p>
                {% endif %}

                <form class="auth-form" action="/login" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" required>
                    <button type="submit">Log in</button>
                </form>

                <p class="auth-switch">New to KnowledgeForge? <a href="/register">Create an account</a>.</p>
            </section>
        </main>
    </body>
</html>
