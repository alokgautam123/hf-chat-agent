<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Create account · KnowledgeForge</title>
        <link rel="stylesheet" href="{{ url_for('static', path='/styles.css') }}">
    </head>
    <body>
        <main class="auth-shell">
            <section class="document-panel auth-panel" aria-labelledby="register-heading">
                <p class="eyebrow">Start your workspace</p>
                <h1 id="register-heading">Create account</h1>
                <p class="intro">Create your KnowledgeForge beta account.</p>

                {% if error %}
                    <p class="message message-error" role="alert">{{ error }}</p>
                {% endif %}

                <form class="auth-form" action="/register" method="post">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                    <label for="email">Email</label>
                    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="new-password" required>
                    <button type="submit">Create account</button>
                </form>

                <p class="auth-switch">Already have an account? <a href="/login">Log in</a>.</p>
            </section>
        </main>
    </body>
</html>
